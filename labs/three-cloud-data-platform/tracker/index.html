<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Learning Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A six-month, hands-on plan for data engineering, data integration and solutions architecture across AWS, Azure and GCP, with progress saved in your browser.">
<style>
:root {
  /* Layout: sticky tab bar over a 1120px column. Overview = hero, summary strip, three cloud cards side by side, track map, phases, shared milestones, settings. Cloud page = header, progress report, schedule grouped by phase and two-week block. */
  --bg: #f1f3f2;
  --surface: #ffffff;
  --surface-2: #e8ecea;
  --ink: #16201c;
  --muted: #56625d;
  --line: #d3dad6;
  --aws: #b45309;
  --azure: #1d5fc4;
  --gcp: #0b7d70;
  --aws-soft: #f6e6d3;
  --azure-soft: #dde8f8;
  --gcp-soft: #d5ece8;
  --on-color: #ffffff;
  --warn: #b42318;
  --warn-soft: #fbe6e3;
  --focus: #1d5fc4;
  --code-bg: #14201c;
  --code-ink: #dbe6e1;
  --font-display: "Bahnschrift", "DIN Alternate", "DIN Next LT Pro", "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1f2a26; --ink: #e4ece8; --muted: #97a5a0; --line: #2a3631;
    --aws: #f0a050; --azure: #7aa8ff; --gcp: #3cc7b4;
    --aws-soft: #3a2915; --azure-soft: #182945; --gcp-soft: #113430;
    --on-color: #0e1412; --warn: #ff8f80; --warn-soft: #3b1b17; --focus: #7aa8ff; --code-bg: #0a0f0d; --code-ink: #dbe6e1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1f2a26; --ink: #e4ece8; --muted: #97a5a0; --line: #2a3631;
  --aws: #f0a050; --azure: #7aa8ff; --gcp: #3cc7b4;
  --aws-soft: #3a2915; --azure-soft: #182945; --gcp-soft: #113430;
  --on-color: #0e1412; --warn: #ff8f80; --warn-soft: #3b1b17; --focus: #7aa8ff; --code-bg: #0a0f0d; --code-ink: #dbe6e1;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 600 clamp(30px, 4.6vw, 46px)/1.08 var(--font-display); letter-spacing: -0.01em; }
h2 { font: 600 23px/1.2 var(--font-display); letter-spacing: 0; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 650; }
code { font: 12.5px/1.4 var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 11.5px/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 13.5px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { display: flex; align-items: center; gap: 16px; min-height: 58px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 600 17px/1 var(--font-display); white-space: nowrap; }
.brand-mark { display: grid; gap: 3px; width: 20px; }
.brand-mark i { display: block; height: 4px; border-radius: 2px; }
.brand-mark i:nth-child(1) { background: var(--aws); width: 100%; }
.brand-mark i:nth-child(2) { background: var(--azure); width: 70%; }
.brand-mark i:nth-child(3) { background: var(--gcp); width: 85%; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--c, var(--ink)); }
.tabs a i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }

main.wrap { display: flex; flex-direction: column; gap: 52px; padding-block: 32px 64px; }
main:focus { outline: none; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; margin-bottom: 18px; }
.section-head p { color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }

/* Shared bits */
.bar { height: 8px; border-radius: 99px; background: var(--c-soft, var(--surface-2)); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: inherit; min-width: 0; transition: width 0.3s ease; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 600 12.5px/1 var(--font-body); padding: 6px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.7; }
.pill.behind { background: var(--warn-soft); color: var(--warn); }
.pill.done::before, .pill.ontrack::before, .pill.ahead::before { background: var(--c, var(--ink)); opacity: 1; }
.pill.upcoming::before { background: transparent; border: 1.5px solid currentColor; }
.pill.now { background: var(--c); color: var(--on-c); }
.pill.now::before { display: none; }
.badge { display: inline-flex; align-items: center; font: 600 10.5px/1 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.lead { background: var(--c); color: var(--on-c); border-color: transparent; }
.badge.port { color: var(--c); border-color: currentColor; }
.badge.optional, .badge.cert, .badge.stretch { border-style: dashed; }
.badge.overdue { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.tag { font: 11.5px/1.4 var(--font-mono); color: var(--muted); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.btn { font: 600 13px/1 var(--font-body); padding: 10px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.danger { color: var(--warn); }
.btn.danger[data-armed="true"] { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.link-btn { font: 600 12.5px/1.2 var(--font-body); background: none; border: 0; padding: 2px 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--ink); }
input[type="text"], input[type="date"], input[type="url"], textarea { font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
textarea { font-family: var(--font-mono); font-size: 12px; resize: vertical; }
label.field { display: block; font-weight: 650; margin-bottom: 8px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* Overview */
.hero { display: grid; gap: 14px; max-width: 760px; padding-top: 8px; }
.hero .lede { color: var(--muted); font-size: 17px; max-width: 62ch; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-top: -24px; }
.stat { display: flex; flex-direction: column; gap: 8px; background: var(--surface); padding: 16px 18px; min-width: 0; }
.stat strong { font: 600 26px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.stat strong small { font-size: 15px; color: var(--muted); font-weight: 500; }
.stat .pill { align-self: flex-start; }

.clouds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cloud-card { display: flex; flex-direction: column; gap: 16px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: inherit; min-width: 0; transition: border-color 0.15s ease, transform 0.15s ease; }
.cloud-card:hover { border-color: var(--c); transform: translateY(-2px); }
.cloud-card:focus-visible { outline-offset: 3px; border-radius: 16px; }
.cc-top { display: flex; align-items: center; gap: 14px; }
.monogram { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: var(--c); color: var(--on-c); font: 700 13px/1 var(--font-mono); letter-spacing: 0.02em; flex: none; }
.cc-name { min-width: 0; }
.cc-name h3 { font: 600 22px/1.1 var(--font-display); }
.cc-name p { color: var(--muted); font-size: 13.5px; }
.cc-pct { margin-left: auto; font: 600 30px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--c); }
.cc-pct small { font-size: 15px; }
.cc-role { font-weight: 600; }
.cc-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cc-next { display: grid; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
.cc-next p { font-weight: 600; }
.cc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.cc-foot .mono { color: var(--muted); }
.cc-open { color: var(--c); font-weight: 700; white-space: nowrap; }

.tm-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tm { display: grid; grid-template-columns: 84px repeat(13, minmax(52px, 1fr)); min-width: 760px; }
.tm > * { min-width: 0; }
.tm-corner { border-bottom: 1px solid var(--line); }
.tm-phase { padding: 12px 10px 10px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); font-weight: 650; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tm-lead { font: 600 10.5px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--c); }
.tm-week { padding: 8px 4px; text-align: center; font: 11.5px/1.2 var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--line); position: relative; }
.tm-now { display: block; font-weight: 700; color: var(--ink); margin-top: 2px; }
.tm-label { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 650; text-decoration: none; }
.tm-label i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.tm-label:hover { color: var(--c); }
.tm-cell { display: flex; align-items: center; padding: 16px 5px; }
.tm-week.is-now, .tm-cell.is-now { background: var(--surface-2); }
.tm-bar { display: block; width: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--c) var(--p), var(--c-soft) var(--p)); }
.tm-bar.lead { height: 12px; }
.tm-bar.port { height: 5px; }
.tm-bar.none { height: 0; border-top: 2px dotted var(--line); background: none; border-radius: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { display: inline-block; width: 28px; border-radius: 99px; background: var(--ink); }
.legend .l-lead { height: 10px; }
.legend .l-port { height: 4px; }
.legend .l-fill { height: 8px; background: linear-gradient(90deg, var(--ink) 50%, var(--surface-2) 50%); }
.legend .l-none { height: 0; border-top: 2px dotted var(--muted); background: none; border-radius: 0; }

.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.phase-card { display: flex; flex-direction: column; gap: 12px; }
.phase-card h3 { font: 600 19px/1.2 var(--font-display); }
.lead-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--c); }
.lead-chip i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.reading { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13.5px; }
.reading a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.reading a:hover { text-decoration-color: currentColor; }
.cert-line { font-size: 13px; color: var(--muted); margin-top: auto; }

.shared-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.group-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.group-h span { font: 12px var(--font-mono); color: var(--muted); font-weight: 400; }

.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.settings-grid .wide { grid-column: 1 / -1; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* Task lists */
.tasks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 16px 18px; }
.task + .task { border-top: 1px solid var(--line); }
.task-check { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--c); cursor: pointer; }
.task-body { display: grid; gap: 7px; min-width: 0; }
.task-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.task-title { font-weight: 650; font-size: 15.5px; cursor: pointer; }
.task-badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.task-detail { color: var(--ink); max-width: 72ch; }
.task-dw { color: var(--muted); font-size: 14px; max-width: 72ch; }
.task-dw span { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--c); margin-right: 4px; }
.task-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 2px; }
.tags { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.completed { font: 600 12px/1 var(--font-mono); color: var(--c); }
.proof-link { font-weight: 650; font-size: 13px; color: var(--c); }
.proof-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.proof-form input { flex: 1 1 260px; }
.form-msg { font-size: 13px; color: var(--warn); }
.task.is-done .task-title { color: var(--muted); }
.task.is-done .task-detail { color: var(--muted); }

/* Step-by-step guides inside a task */
.guide { border-top: 1px dashed var(--line); padding-top: 9px; margin-top: 2px; min-width: 0; }
.guide > summary { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none; font-weight: 650; font-size: 14px; color: var(--c); }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary::before { content: "▸"; display: inline-block; transition: transform 0.15s ease; }
.guide[open] > summary::before { transform: rotate(90deg); }
.guide-day { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.guide-body { display: grid; gap: 10px; margin-top: 12px; max-width: 78ch; min-width: 0; font-size: 14.5px; }
.guide-body h4 { margin: 10px 0 0; font-size: 15px; font-weight: 650; }
.guide-body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.g-label { font: 600 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: -4px; }
.g-code { position: relative; min-width: 0; }
.g-code pre { margin: 0; padding: 12px 14px; padding-right: 66px; border-radius: 8px; background: var(--code-bg); color: var(--code-ink); font: 12.5px/1.55 var(--font-mono); overflow-x: auto; white-space: pre; }
.g-out pre { background: var(--bg); color: var(--ink); border: 1px dashed var(--line); padding-right: 14px; }
.g-copy { position: absolute; top: 7px; right: 7px; font: 600 11.5px/1 var(--font-body); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--code-ink); background: transparent; color: var(--code-ink); cursor: pointer; opacity: 0.85; }
.g-copy:hover { opacity: 1; }
.g-try, .g-warn { border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.g-try { background: var(--c-soft); }
.g-try .g-label { color: var(--c); }
.g-warn { background: var(--warn-soft); }
.g-warn .g-label { color: var(--warn); }

/* Cloud page */
.cloud-head { display: grid; gap: 18px; }
.back { font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none; justify-self: start; }
.back:hover { color: var(--ink); }
.cloud-title { display: flex; gap: 18px; align-items: flex-start; }
.cloud-title .monogram { width: 58px; height: 58px; font-size: 15px; border-radius: 12px; }
.cloud-title > div { display: grid; gap: 8px; min-width: 0; }
.cloud-title .lede { color: var(--muted); font-size: 16.5px; max-width: 64ch; }

.report { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.report-main { display: grid; gap: 16px; }
.report-figure { display: flex; align-items: center; gap: 18px; }
.big { font: 600 56px/1 var(--font-display); color: var(--c); font-variant-numeric: tabular-nums; }
.big small { font-size: 24px; }
.report-status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.phase-rows { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.phase-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 90px 46px; align-items: center; gap: 12px; font-size: 14px; }
.phase-row .count { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; }
.report-side { display: grid; gap: 16px; }
.report-side h3 { margin-top: 6px; }
.mini, .next, .recent { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.mini li { display: flex; gap: 10px; align-items: flex-start; }
.mini-check { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 4px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; line-height: 1; color: var(--on-c); }
.mini li.is-done .mini-check { background: var(--c); border-color: var(--c); }
.mini li.is-done { color: var(--muted); }
.next li, .recent li { display: grid; gap: 1px; }
.next li span, .recent li span { font-size: 12.5px; color: var(--muted); }
.report-side .eyebrow + .eyebrow, .recent-h { margin-top: 18px; }
.jump { margin-top: 14px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px/1 var(--font-body); padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.phase-group { display: grid; gap: 18px; }
.phase-group + .phase-group { margin-top: 40px; }
.phase-head { display: grid; gap: 6px; }
.phase-head h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font: 600 21px/1.2 var(--font-display); }
.block { display: grid; gap: 10px; scroll-margin-top: 80px; }
.block-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.block-weeks { font: 600 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--c); }
.block-dates { font-size: 13px; color: var(--muted); }
.block-title { font-weight: 650; }
.block-count { margin-left: auto; font: 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.block.is-now .tasks { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.empty { padding: 28px; text-align: center; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pager a { display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; }
.pager a:hover { border-color: var(--c); }

    // GCP: leads data engineering

  function phaseOf(block) {
    for (var i = 0; i < PHASES.length; i++) if (block >= PHASES[i].from && block <= PHASES[i].to) return PHASES[i];
    return PHASES[PHASES.length - 1];

  TASKS.forEach(function (t) {

  var TASK_IDS = {};
  TASKS.forEach(function (t) { TASK_IDS[t.id] = true; });

  // ---------- Saved state ----------
  var storageOk = true;
  try { localStorage.setItem(KEY + ".probe", "1"); localStorage.removeItem(KEY + ".probe"); } catch (e) { storageOk = false; }

  function isISO(v) {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = parseISO(v);
    return !isNaN(d.getTime()) && iso(d) === v;
  }
  function safeUrl(v) {
    if (typeof v !== "string" || v.length > 500 || !/^https?:\/\//i.test(v)) return false;

  }
  function clean(s) {
    s = s && typeof s === "object" ? s : {};
    var done = {}, proof = {}, k;
    if (s.done && typeof s.done === "object") for (k in s.done) if (TASK_IDS[k] && isISO(s.done[k])) done[k] = s.done[k];
    if (s.proof && typeof s.proof === "object") for (k in s.proof) if (TASK_IDS[k] && safeUrl(s.proof[k])) proof[k] = s.proof[k];
    return {
      done: done,
      proof: proof,
      name: typeof s.name === "string" ? s.name.slice(0, 60) : "",
      start: isISO(s.start) ? s.start : DEFAULT_START,
      filter: ["all", "todo", "done", "now"].indexOf(s.filter) >= 0 ? s.filter : "all"
    };
  }
  function readStore() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; }
  }
  var state = clean(readStore());
  if (!isISO(readStore().start)) save(); // remember the first visit's start date
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
  }

  // ---------- Dates ----------
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function startDate() { return parseISO(state.start); }
  function endDate() { return addDays(startDate(), 26 * 7 - 1); }
  function blockStart(b) { return addDays(startDate(), (b - 1) * 14); }
  function blockEnd(b) { return addDays(startDate(), b * 14 - 1); }
  function daysSinceStart() { return Math.round((today() - startDate()) / 86400000); }
  function currentWeek() { var d = daysSinceStart(); return d < 0 ? 0 : Math.floor(d / 7) + 1; }
  function currentBlock() { var w = currentWeek(); if (w < 1) return 0; if (w > 26) return 14; return Math.ceil(w / 2); }
  var fmtD = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short" });
  var fmtY = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
  function weeksLabel(b) { return "Weeks " + (2 * b - 1) + "–" + (2 * b); }
  function rangeLabel(b) {
    var a = blockStart(b), z = blockEnd(b);
    return a.getMonth() === z.getMonth() ? a.getDate() + "–" + fmtD.format(z) : fmtD.format(a) + " – " + fmtD.format(z);
  }
  function phaseRange(p) { return fmtD.format(blockStart(p.from)) + " – " + fmtY.format(blockEnd(p.to)); }

  // ---------- Progress ----------
  function required(list) { return list.filter(function (t) { return !t.optional; }); }
  function optionalOnly(list) { return list.filter(function (t) { return t.optional; }); }
  function count(list) {
    var d = list.filter(function (t) { return state.done[t.id]; }).length;
    return { done: d, total: list.length, pct: list.length ? Math.round(d / list.length * 100) : 0 };
  }
  function statusOf(list) {
    var req = required(list), cb = currentBlock(), c = count(req);
    if (c.total && c.done === c.total) return { key: "done", label: "Complete" };
    if (cb < 1) return { key: "upcoming", label: "Not started" };
    var overdue = req.filter(function (t) { return t.block < cb && !state.done[t.id]; }).length;
    if (overdue) return { key: "behind", label: overdue + " overdue", n: overdue };
    var ahead = req.filter(function (t) { return t.block > cb && state.done[t.id]; }).length;
    if (ahead) return { key: "ahead", label: "Ahead of schedule" };
    return { key: "ontrack", label: "On track" };
  }
  function statusDetail(s) {

    }).join("");

  function storageText() {

  function renderOverview() {
    var all = TASKS;
    var s = count(required(all));
    var so = count(optionalOnly(all));
    var st = statusOf(all);
    var w = currentWeek(), cb = currentBlock();
    var weekText = w < 1 ? "Not started" : w > 26 ? "Finished" : "Week " + w + " <small>of 26</small>";
    var nowText = cb < 1 ? "Week 1 starts " + fmtY.format(startDate()) : cb > 13 ? "All 26 weeks are over" : "Now: " + weeksLabel(cb) + ", " + BLOCKS[cb];
    var shared = TASKS.filter(function (t) { return t.cloud === "shared"; });

      "</section>" +
      '<section aria-labelledby="map-h">' +
        '<div class="section-head"><h2 id="map-h">Six months at a glance</h2><p>Thirteen two-week blocks. The lead role rotates: GCP, then Azure, then AWS.</p></div>' +

      '<section aria-labelledby="phases-h">' +

          '<div><h3 class="group-h">Before you start <span>Weeks 1–2</span></h3><ul class="tasks">' + shared.filter(function (t) { return t.block === 1; }).map(taskHTML).join("") + "</ul></div>" +
          '<div><h3 class="group-h">Capstone <span>Weeks 25–26</span></h3><ul class="tasks">' + shared.filter(function (t) { return t.block === 13; }).map(taskHTML).join("") + "</ul></div>" +
        "</div>" +
      "</section>" +
      '<section aria-labelledby="settings-h">' +
        '<div class="section-head"><h2 id="settings-h">Settings and backup</h2><p>' + esc(storageText()) + "</p></div>" +
        '<div class="settings-grid">' +
          '<div class="panel"><label class="field" for="set-name">Your name</label><input type="text" id="set-name" maxlength="60" autocomplete="name" value="' + esc(state.name) + '" placeholder="Shown at the top of this page"><p class="hint">Appears above the headline, so the tracker can double as a portfolio page.</p></div>' +
          '<div class="panel"><label class="field" for="set-start">Start date</label><input type="date" id="set-start" value="' + state.start + '"><p class="hint">Every week and due date is worked out from this. Week 26 ends ' + fmtY.format(endDate()) + ".</p></div>" +
          '<div class="panel wide"><label class="field" for="backup">Backup</label>' +
            '<textarea id="backup" rows="3" spellcheck="false" placeholder="Paste a backup here, then choose Restore."></textarea>' +
            '<div class="btn-row"><button type="button" class="btn" data-action="copy-backup">Copy backup</button><button type="button" class="btn" data-action="restore">Restore from pasted backup</button><button type="button" class="btn danger" data-action="reset">Erase all progress</button></div>' +
            '<p class="hint" id="backup-msg" role="status"></p>' +
          "</div>" +
        "</div>" +
      "</section>";
  }

  // ---------- Cloud page ----------
  var FILTERS = [["all", "All"], ["todo", "To do"], ["done", "Done"], ["now", "This block"]];

  function renderCloud(k) {
    var c = CLOUDS[k];
    var list = TASKS.filter(function (t) { return t.cloud === k; });
    var req = required(list);
    var s = count(req), so = count(optionalOnly(list)), st = statusOf(list);
    var cb = currentBlock();
    var focusBlock = cb < 1 ? 1 : cb > 13 ? 13 : cb;
    var blockTasks = list.filter(function (t) { return t.block === focusBlock; });
    var cs = cloudStyle(k);

    var phaseRows = PHASES.map(function (p) {
      var pl = req.filter(function (t) { return t.block >= p.from && t.block <= p.to; });
      if (!pl.length) return "";
      var ps = count(pl);
      var role = p.lead === k ? "lead" : "port";
      return '<div class="phase-row"><span>' + esc(p.name) + '</span><span class="badge ' + role + '">' + (role === "lead" ? "Lead" : "Port") + "</span>" + bar(ps.pct, p.name) + '<span class="count">' + ps.done + "/" + ps.total + "</span></div>";
    }).join("");

    var next = nextTasks(list, 3).map(function (t) { return "<li>" + esc(t.title) + "<span>" + weeksLabel(t.block) + " · " + rangeLabel(t.block) + "</span></li>"; }).join("");
    var recent = recentDone(list, 3).map(function (t) { return "<li>" + esc(t.title) + "<span>Completed " + esc(fmtY.format(parseISO(state.done[t.id]))) + "</span></li>"; }).join("");

    var mini = blockTasks.map(function (t) {
      var d = !!state.done[t.id];
      return '<li class="' + (d ? "is-done" : "") + '"><span class="mini-check" aria-hidden="true">' + (d ? "✓" : "") + "</span><span>" + esc(t.title) + (t.optional ? " (optional)" : "") + '<span class="sr">' + (d ? ", done" : ", not done") + "</span></span></li>";
    }).join("");

    var h = '<section class="cloud-head" style="' + cs + '">' +
        '<a class="back" href="#overview">← All three clouds</a>' +
        '<div class="cloud-title"><span class="monogram" aria-hidden="true">' + c.mono + "</span><div>" +
          '<p class="eyebrow">' + c.full + " · " + esc(c.endpoint) + "</p>" +
          "<h1>" + c.name + " track</h1>" +
          '<p class="lede">' + esc(c.summary) + "</p>" +
        "</div></div>" +
      "</section>";

    h += '<section class="report" style="' + cs + '" aria-label="Progress report">' +
        '<div class="panel report-main">' +
          '<p class="eyebrow">Progress report</p>' +
          '<div class="report-figure"><span class="big">' + s.pct + "<small>%</small></span><div><p><strong>" + s.done + " of " + s.total + '</strong> tasks done</p><p class="sub">Optional: ' + so.done + " of " + so.total + " (certification and real-cloud slice)</p></div></div>" +
          bar(s.pct, c.name + " progress") +
          '<div class="report-status">' + pill(st) + '<span class="sub">' + esc(statusDetail(st)) + "</span></div>" +
          '<div class="phase-rows">' + phaseRows + "</div>" +
        "</div>" +
        '<div class="report-side">' +
          '<div class="panel">' +
            '<p class="eyebrow">' + (cb < 1 ? "First block" : cb > 13 ? "Last block" : "This block") + "</p>" +
            "<h3>" + weeksLabel(focusBlock) + " · " + esc(BLOCKS[focusBlock]) + "</h3>" +
            '<p class="sub">' + rangeLabel(focusBlock) + " · " + KIND_LABEL[blockTasks.length ? blockTasks[0].kind : "port"] + "</p>" +
            '<ul class="mini">' + mini + "</ul>" +
            '<button type="button" class="link-btn jump" data-action="jump" data-block="' + focusBlock + '">Go to this block in the schedule</button>' +
          "</div>" +
          '<div class="panel">' +
            '<p class="eyebrow">Next up</p>' +
            (next ? '<ol class="next">' + next + "</ol>" : '<p class="sub" style="margin-top:10px">Nothing left. Well done.</p>') +
            '<p class="eyebrow recent-h">Recently completed</p>' +
            (recent ? '<ul class="recent">' + recent + "</ul>" : '<p class="sub" style="margin-top:10px">Nothing ticked off yet. Your first task is at the top of the schedule.</p>') +
          "</div>" +
        "</div>" +
      "</section>";

    var filterBtns = FILTERS.map(function (f) {
      return '<button type="button" class="chip" data-action="filter" data-filter="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + "</button>";
    }).join("");

    var body = "";
    PHASES.forEach(function (p) {
      var blocksHtml = "";
      for (var b = p.from; b <= p.to; b++) {
        var bt = list.filter(function (t) { return t.block === b; });
        var shown = bt.filter(function (t) {
          if (state.filter === "todo") return !state.done[t.id];
          if (state.filter === "done") return !!state.done[t.id];
          if (state.filter === "now") return b === focusBlock;
          return true;
        });
        if (!shown.length) continue;
        var bc = count(required(bt));
        var isNow = b === cb;
        blocksHtml += '<div class="block' + (isNow ? " is-now" : "") + '" id="block-' + b + '">' +
          '<div class="block-head"><span class="block-weeks">' + weeksLabel(b) + '</span><span class="block-dates">' + rangeLabel(b) + '</span><strong class="block-title">' + esc(BLOCKS[b]) + "</strong>" +
          (isNow ? '<span class="pill now">This block</span>' : "") +
          (bc.total ? '<span class="block-count">' + bc.done + "/" + bc.total + " done</span>" : '<span class="block-count">optional</span>') + "</div>" +
          '<ul class="tasks">' + shown.map(taskHTML).join("") + "</ul></div>";
      }
      if (!blocksHtml) return;
      var role = p.lead === k ? "lead" : p.lead ? "port" : "stretch";
      var roleText = role === "lead" ? c.name + " leads this phase. Build each piece here first."
        : role === "port" ? CLOUDS[p.lead].name + " leads this phase. Port each build here once it works there."
        : "An optional real-cloud slice for " + c.name + ". The shared capstone tasks are on the overview.";
      body += '<div class="phase-group">' +
        '<div class="phase-head"><p class="eyebrow">' + p.months + " · " + esc(phaseRange(p)) + "</p>" +
        "<h3>" + esc(p.name) + ' <span class="badge ' + role + '">' + (role === "lead" ? "Lead build" : role === "port" ? "Port" : "Optional") + "</span></h3>" +
        '<p class="sub">' + esc(roleText) + "</p></div>" + blocksHtml + "</div>";
    });
    if (!body) {
      body = '<div class="panel empty">' + (state.filter === "done" ? "No tasks ticked off yet." : "Nothing to show for this filter.") + "</div>";
    }

    h += '<section style="' + cs + '" aria-labelledby="sched-h">' +
        '<div class="section-head"><h2 id="sched-h">Schedule and tasks</h2><div class="filters" role="group" aria-label="Show tasks">' + filterBtns + "</div></div>" +
        body +
      "</section>";

    var i = ORDER.indexOf(k);
    var prev = ORDER[(i + ORDER.length - 1) % ORDER.length], nxt = ORDER[(i + 1) % ORDER.length];
    h += '<nav class="pager" aria-label="Other clouds">' +
        '<a href="#' + prev + '" style="' + cloudStyle(prev) + '"><span class="sub">← Previous track</span><strong>' + CLOUDS[prev].name + "</strong></a>" +
        '<a class="next-link" href="#' + nxt + '" style="' + cloudStyle(nxt) + '"><span class="sub">Next track →</span><strong>' + CLOUDS[nxt].name + "</strong></a>" +
      "</nav>";
    return h;
  }

  // ---------- Router ----------
  var view = document.getElementById("view");
  var current = "overview";
  function viewFromHash() { var h = (location.hash || "").replace(/^#/, ""); return CLOUDS[h] ? h : "overview"; }
  function render() {
    view.innerHTML = current === "overview" ? renderOverview() : renderCloud(current);
    var navs = document.querySelectorAll("[data-nav]");
    for (var i = 0; i < navs.length; i++) {
      if (navs[i].getAttribute("data-nav") === current) navs[i].setAttribute("aria-current", "page");
      else navs[i].removeAttribute("aria-current");
    }
    document.getElementById("storage-foot").textContent = storageOk ? "Progress is saved in this browser." : "Progress isn't being saved in this browser.";
  }
  function rerender(focusId) {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  }
  function go(target) {
    current = target;
    render();
    window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", function () { go(viewFromHash()); });
  // In-page navigation also works where the address bar doesn't follow hash changes.
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var target = a.getAttribute("href").slice(1);
    if (target !== "overview" && !CLOUDS[target]) return;
    e.preventDefault();
    if (location.hash !== "#" + target) { try { history.pushState(null, "", "#" + target); } catch (err) {} }
    go(target);
  });
  window.addEventListener("popstate", function () { var v = viewFromHash(); if (v !== current) go(v); });

  // ---------- Interactions ----------
  var resetTimer = null;
  function msg(text) { var m = document.getElementById("backup-msg"); if (m) m.textContent = text; }

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("task-check")) {
      var id = t.getAttribute("data-id");
      if (t.checked) state.done[id] = iso(today()); else delete state.done[id];
      save();
      rerender("cb-" + id);
    } else if (t.id === "set-name") {
      state.name = t.value.trim().slice(0, 60);
      save();
      var eyebrow = document.querySelector(".hero .eyebrow");
      if (eyebrow) eyebrow.textContent = (state.name ? state.name + " · " : "") + "Cloud learning tracker";
    } else if (t.id === "set-start") {
      if (isISO(t.value)) { state.start = t.value; save(); rerender("set-start"); }
    }
  });

  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");

    if (action === "filter") {
      state.filter = btn.getAttribute("data-filter");
      save();
      rerender();
      var chip = document.querySelector('.chip[data-filter="' + state.filter + '"]');
      if (chip) chip.focus({ preventScroll: true });
    } else if (action === "jump") {
      if (state.filter !== "all" && state.filter !== "now") { state.filter = "all"; save(); rerender(); }
      var blk = document.getElementById("block-" + btn.getAttribute("data-block"));
      if (blk) blk.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    } else if (action === "proof") {
      var form = document.getElementById("pf-wrap-" + id);
      var open = form.hidden;
      form.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
      if (open) document.getElementById("pf-" + id).focus();
    } else if (action === "proof-clear") {
      delete state.proof[id];
      save();
      rerender("cb-" + id);
    } else if (action === "copy-code") {
      var pre = btn.parentNode.querySelector("pre");
      var flash = function (text) { btn.textContent = text; setTimeout(function () { btn.textContent = "Copy"; }, 1500); };
      var selectIt = function () {
        var r = document.createRange(); r.selectNodeContents(pre);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        flash("Press Ctrl+C");
      };
      try { navigator.clipboard.writeText(pre.textContent).then(function () { flash("Copied"); }, selectIt); } catch (err) { selectIt(); }
    } else if (action === "copy-backup") {
      var data = JSON.stringify({ app: "cloud-learning-tracker", version: 1, savedAt: iso(today()), name: state.name, start: state.start, done: state.done, proof: state.proof });
      var ta = document.getElementById("backup");
      ta.value = data;
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(data).then(function () {
          msg("Backup copied. Paste it somewhere safe, such as a note or your repo.");
        }, function () { msg("The backup is selected in the box. Press Ctrl+C to copy it."); });
      } else {
        msg("The backup is selected in the box. Press Ctrl+C to copy it.");
      }
    } else if (action === "restore") {
      var raw = document.getElementById("backup").value.trim();
      if (!raw) { msg("Paste a backup into the box first."); return; }
      var parsed;
      try { parsed = JSON.parse(raw); } catch (err) { msg("That isn't a backup from this tracker. Copy the whole backup text and try again."); return; }
      if (!parsed || typeof parsed !== "object" || typeof parsed.done !== "object") { msg("That isn't a backup from this tracker. Copy the whole backup text and try again."); return; }
      var f = state.filter;
      state = clean(parsed);
      state.filter = f;
      save();
      rerender();
      msg("Restored " + Object.keys(state.done).length + " completed tasks.");
    } else if (action === "reset") {
      if (btn.getAttribute("data-armed") !== "true") {
        btn.setAttribute("data-armed", "true");
        btn.textContent = "Click again to erase everything";
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          var b = document.querySelector('[data-action="reset"]');
          if (b) { b.removeAttribute("data-armed"); b.textContent = "Erase all progress"; }
        }, 5000);
        return;
      }
      clearTimeout(resetTimer);
      state = clean({ name: state.name, start: state.start });
      save();
      rerender();
      msg("All progress erased. Your name and start date were kept.");
    }
  });

  // "toggle" doesn't bubble, so listen in the capture phase.
  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (d.classList && d.classList.contains("guide")) openGuides[d.getAttribute("data-id")] = d.open;
  }, true);

  document.addEventListener("submit", function (e) {
    var form = e.target.closest(".proof-form");
    if (!form) return;
    e.preventDefault();
    var id = form.getAttribute("data-id");
    var val = document.getElementById("pf-" + id).value.trim();
    var out = form.querySelector(".form-msg");
    if (!val) { delete state.proof[id]; save(); rerender("cb-" + id); return; }
    if (!safeUrl(val)) { out.textContent = "Use a full link that starts with https://"; return; }
    state.proof[id] = val;
    save();
    rerender("cb-" + id);
  });

  current = viewFromHash();
  render();
})();
</script>

</html>
